name: Build Android APK

on:
  workflow_dispatch:          # manual trigger
  push:
    tags:
      - 'v*'                  # auto-trigger on version tags

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            build-essential libsqlite3-dev \
            ccache

      - name: Set up Java 17
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH

      - name: Cache buildozer global dir (Android SDK/NDK)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-buildozer

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build debug APK
        run: |
          buildozer -v android debug 2>&1 | tee buildozer.log
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: writing-for-me-${{ github.ref_name }}-debug
          path: bin/*.apk
          retention-days: 30

      - name: Upload build log (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log-${{ github.ref_name }}
          path: buildozer.log
          retention-days: 7

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
          generate_release_notes: true
          body: |
            ## Writing for Me ${{ github.ref_name }}

            ### Android APK
            Download the APK below and install it on your Android device.

            > **Note:** You may need to enable "Install from unknown sources" in your Android settings.

            ### Requirements
            - Android 5.0+ (API 21)
            - arm64-v8a architecture
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
